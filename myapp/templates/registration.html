{% extends "base.html" %}

{% block title %}
Create Account
{% endblock %}

{% block content %}

<section class="authentication-section">

    <div class="authentication-card">

        <h2>Create Account</h2>

        {% if messages %}
            <div class="form-messages">
                {% for message in messages %}
                    <p class="form-message {{ message.tags }}">
                        {{ message }}
                    </p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'registration' %}">
            {% csrf_token %}

            <input
                type="hidden"
                name="next"
                value="{{ next|default:'' }}"
            >

            <div class="form-group">
                <label for="fullname">Full Name</label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    value="{{ request.POST.fullname|default:'' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ request.POST.email|default:'' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>

                <input
                    type="date"
                    id="dob"
                    name="dob"
                    value="{{ request.POST.dob|default:'' }}"
                >
            </div>

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ request.POST.username|default:'' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    required
                >
            </div>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p>
            Already have an account?

            <a href="{% url 'login' %}?next={{ next|urlencode }}">
                Login
            </a>
        </p>

    </div>

</section>

{% endblock %}
